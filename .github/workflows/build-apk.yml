name: Build ViewSync Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-34" "platform-tools"

      - name: 5. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 6. Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: 7. Build Web Distribution & Sync to Android
        run: |
          npm run build
          npx cap sync android

      - name: 8. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 9. Compile Android Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 10. Copy and Rename APK for Distribution
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ViewSync-v1.0.apk
          echo "APK successfully compiled at build-output/ViewSync-v1.0.apk"
          ls -lh build-output/ViewSync-v1.0.apk

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViewSync-Android-APK
          path: build-output/ViewSync-v1.0.apk
          retention-days: 30
